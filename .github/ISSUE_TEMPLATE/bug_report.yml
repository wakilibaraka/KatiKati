name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Filling in the version fields
        saves a round-trip. In Settings > About, **Diagnostic Info > Copy** gives
        you the app, system and display details to paste below.

  - type: input
    id: app-version
    attributes:
      label: KatiKati version
      description: >
        Settings > About shows the version.
      placeholder: "0.17.0 (50)"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: >
        Apple menu > About This Mac.
      placeholder: "macOS 15.6 (Apple Silicon)"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: >
        What did you do, step by step? If it only happens with a specific app,
        please name it — window behaviour varies a lot between apps.
      placeholder: |
        1. Open two Finder windows
        2. Minimize the front one
        3. Click its card in the taskbar
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: >
        A screenshot or short screen recording helps a lot for anything visual.
    validations:
      required: true

  - type: dropdown
    id: accessibility
    attributes:
      label: Accessibility permission
      description: >
        System Settings > Privacy & Security > Accessibility. KatiKati also runs without it (limited mode).
      options:
        - "Granted"
        - "Not granted (limited mode)"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        Does it happen every time or only sometimes? Did it start after an update?
    validations:
      required: false
