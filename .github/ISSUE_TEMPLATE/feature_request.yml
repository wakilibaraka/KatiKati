name: Feature request
description: Suggest an improvement or a new feature
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like KatiKati to do?
      description: Describe how you would use it. Screenshots or sketches help.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Taskbar
        - Launcher
        - Pinboard and Quick Settings
        - Edge decks
        - Shortcuts
        - Settings
        - Other
    validations:
      required: false
