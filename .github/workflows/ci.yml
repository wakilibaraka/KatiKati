# Continuous integration for the public repo (added 2026-09-05).
#
# Runs on every push and pull request: the localization catalog check (a missing zh-Hans
# key is invisible to the compiler and silently shows English to Chinese users) and the
# full unit-test suite. No signing, no notarization, no artifacts - release packaging is
# Scripts/package_release.sh on the maintainer's machine (Docs/29).
#
# Runner: xcode-27 (arm64, macOS 27 + Xcode 27 SDK). The code names macOS 27 AppKit
# symbols (NSScreen.touchCapabilities, NSEvent.isTouchSwipeNavigationEnabled) inside
# #available(macOS 27.0, *) — a runtime guard, not an SDK one — so the macOS 26 SDK's
# Xcode 26 cannot even parse the file. The Xcode-27 image is arm64 only; that is fine
# for a project whose only supported OS is Apple silicon.
#
# (Historically macos-26/Xcode 26: it could not compile the island port, which is what
# kept CI red until 2026-11-25.)
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Localization check + unit tests
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Localization catalog check
        run: python3 Scripts/check_localization.py

      - name: Debug-switch registry check
        run: python3 Scripts/check_debug_switches.py

      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project KatiKati.xcodeproj \
            -scheme KatiKati \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild-test.log | grep -E 'error:|warning: unre|Executed [0-9]+ tests|\*\* TEST' || true
          grep -E 'Executed [0-9]+ tests, with 0 failures' build/xcodebuild-test.log

      # Conformance-availability warnings do not fail a build, but they crash at launch on
      # the deployment target (macOS 12): CGRect/CGPoint/CGSize Hashable is macOS 15+, and
      # a Set<CGRect> shipped that way in 0.11.0-0.11.2. The runner compiles from a fresh
      # checkout, so this log carries every warning.
      - name: Cross-version conformance check
        run: python3 Scripts/check_availability_warnings.py build/xcodebuild-test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-test-log
          path: build/xcodebuild-test.log
          if-no-files-found: ignore
